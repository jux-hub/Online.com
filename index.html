<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TESTE MODAL FIREGUARDIAN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* RESET E BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; }

        /* CARD DE TESTE */
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border-left: 5px solid #d32f2f;
        }

        .btn-teste {
            width: 100%;
            padding: 15px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* MODAL ESTRUTURA CRÍTICA */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; /* Alterado de opacity para display para teste de carga */
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            transform: translateY(0);
        }

        .close-btn {
            float: right;
            font-size: 24px;
            font-weight: bold;
            color: #666;
            padding: 5px;
        }

        .info {
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        /* Estilo para travar o scroll do body no Android */
        .no-scroll { overflow: hidden; height: 100vh; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin: 20px 0;">FireGuardian Debug</h2>

    <button class="btn-teste" onclick="abrirModal()">
        <i class="fas fa-play"></i> TESTAR MODAL AGORA
    </button>

    <div class="card" onclick="abrirModal()">
        <h3>Extintor PQS</h3>
        <p>Clique aqui para detalhes</p>
    </div>

    <div id="meuModal" class="modal-overlay" onclick="fecharNoFundo(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h2 style="color: #d32f2f">Detalhes</h2>
            <div class="info">
                <p><strong>Item:</strong> Extintor Pó Químico</p>
                <p><strong>Status:</strong> <span style="color: green">OK</span></p>
            </div>
            <button class="btn-teste" style="margin: 0" onclick="alert('Ação executada!')">EDITAR</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('meuModal');

        function abrirModal() {
            modal.classList.add('active');
            document.body.classList.add('no-scroll');
            console.log("Modal Aberto");
        }

        function fecharModal() {
            modal.classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        function fecharNoFundo(e) {
            if (e.target === modal) {
                fecharModal();
            }
        }

        // Teste de Log para capturar no Logcat do Android Studio
        window.onerror = function(msg, url, line) {
            console.log("Erro no WebView: " + msg + " em " + line);
            return false;
        };
    </script>
</body>
</html>
