<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seu App - Oferta Especial</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Fundo do modal (escurecido) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Caixa do modal */
    .modal {
      background: white;
      border-radius: 24px;
      max-width: 380px;
      width: 90%;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      transform: translateY(40px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    /* Imagem no topo (muito importante para atrair atenção) */
    .modal-header {
      height: 220px;
      background: linear-gradient(135deg, #00c4b4, #0077b6);
      position: relative;
    }

    .modal-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Conteúdo */
    .modal-body {
      padding: 28px 24px;
      text-align: center;
    }

    .modal-body h2 {
      font-size: 26px;
      margin-bottom: 12px;
      line-height: 1.2;
      color: #1a1a1a;
    }

    .modal-body p {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .benefits {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      color: #333;
    }

    .benefit-item::before {
      content: "✓";
      color: #00c853;
      font-weight: bold;
      font-size: 20px;
    }

    /* Botões */
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: #00c853;
      color: white;
    }

    .btn-primary:hover {
      background: #00b140;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: #555;
      margin-top: 12px;
      font-size: 15px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.4);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <!-- Botão de teste para abrir o modal (no seu app pode ser automático) -->
  <button onclick="abrirModal()" style="padding:16px 32px; font-size:18px; background:#0077b6; color:white; border:none; border-radius:12px; cursor:pointer;">
    Ver Oferta Especial
  </button>

  <!-- Modal -->
  <div id="ofertaModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <!-- Coloque aqui uma imagem bonita do seu produto/cartão/cartão virtual -->
        <!-- Sugestão: use uma imagem de cartão moderno, dinheiro, cashback, etc. -->
        <img src="https://images.unsplash.com/photo-1556740714-a8395b3a74dd?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Cartão exclusivo">
        <div class="close-btn" onclick="fecharModal()">×</div>
      </div>

      <div class="modal-body">
        <h2>Peça seu Cartão Exclusivo Agora!</h2>
        <p>Tenha cashback em todas as compras e aproveite benefícios incríveis no nosso app.</p>

        <div class="benefits">
          <div class="benefit-item">Até 5% de cashback em compras selecionadas</div>
          <div class="benefit-item">Sem anuidade e sem complicação</div>
          <div class="benefit-item">Aceito em qualquer lugar que tenha débito/crédito</div>
          <div class="benefit-item">Dinheiro de volta direto na sua conta</div>
        </div>

        <button class="btn btn-primary" onclick="alert('Indo para a página de solicitação... (adicione sua lógica aqui)')">
          Quero meu cartão agora
        </button>

        <button class="btn btn-secondary" onclick="fecharModal()">
          Talvez mais tarde
        </button>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('ofertaModal');

    function abrirModal() {
      modal.classList.add('active');
      // Opcional: impedir scroll do body
      document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    // Fecha ao clicar fora do modal
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        fecharModal();
      }
    });

    // Para abrir automaticamente quando carregar a página (comente se não quiser)
    // window.onload = function() {
    //   setTimeout(abrirModal, 1500); // abre depois de 1,5 segundos
    // };
  </script>

</body>
</html>
