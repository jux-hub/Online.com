<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>YouTube Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg: #0f1220;
            --card: #171a2e;
            --primary: #4f7cff;
            --primary-hover: #3b66e0;
            --text: #ffffff;
            --muted: #a0a3bd;
            --danger: #ff5c5c;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1b1f3b, var(--bg));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .input-group input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 1rem;
        }

        .input-group button {
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .input-group button:hover {
            background: var(--primary-hover);
        }

        .info-section {
            margin-top: 25px;
            border-top: 1px solid #2c2f55;
            padding-top: 20px;
        }

        .video-info {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .video-info img {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 8px;
        }

        .video-info h3 {
            margin: 0 0 5px;
            font-size: 1rem;
            color: var(--text);
        }

        .video-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .qualities {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quality-group {
            background: #1e2238;
            border-radius: 12px;
            padding: 12px;
        }

        .quality-group h4 {
            margin: 0 0 10px;
            font-size: 0.95rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quality-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quality-btn {
            background: #2c2f55;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .quality-btn:hover {
            background: var(--primary);
        }

        .quality-btn i {
            font-size: 0.9rem;
        }

        /* MODAL */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            width: 90%;
            max-width: 360px;
            max-height: 80vh;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,.5);
            animation: pop 0.25s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .modal-content.expanded {
            max-width: 600px;
        }

        .player-container {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            background: #0f1220;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-container audio,
        .player-container video {
            width: 100%;
            max-height: 50vh;
            display: block;
            object-fit: contain;
        }

        @keyframes pop {
            from { transform: scale(.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid #2c2f55;
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 10px auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-buttons {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons.inline {
            grid-template-columns: 1fr 1fr;
        }

        .btn-secondary {
            background: #2c2f55;
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        a {
            text-decoration: none;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>YouTube Downloader</h1>
    <div class="subtitle">Cole o link e escolha a qualidade desejada</div>

    <label>Link do vídeo do YouTube</label>
    <div class="input-group">
        <input id="url" type="text" placeholder="https://youtu.be/...">
        <button onclick="analisarVideo()" id="btnAnalisar">
            <i class="bi bi-search"></i> Analisar
        </button>
    </div>

    <!-- Área de informações do vídeo e qualidades -->
    <div id="infoArea" class="info-section" style="display: none;">
        <div id="videoInfo" class="video-info"></div>
        <div id="qualitiesContainer" class="qualities"></div>
    </div>

    <!-- Mensagem de erro ou carregamento -->
    <div id="loadingOrError" style="text-align: center; margin-top: 20px;"></div>
</div>

<!-- MODAL (para download concluído) -->
<div class="modal" id="modal">
    <div class="modal-content" id="modal-content">
        <!-- conteúdo dinâmico -->
    </div>
</div>

<script>
    // ================= CONFIGURAÇÕES DA API =================
    // Altere para a URL base da sua API (deve suportar os endpoints /info e /download)
    const API_BASE = "https://speednetssh.com.br/youtube/"; 

    // ================= ELEMENTOS DOM =================
    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modal-content");
    const infoArea = document.getElementById("infoArea");
    const videoInfoDiv = document.getElementById("videoInfo");
    const qualitiesContainer = document.getElementById("qualitiesContainer");
    const loadingOrError = document.getElementById("loadingOrError");
    const urlInput = document.getElementById("url");

    // ================= FUNÇÕES AUXILIARES =================
    function abrirModal(html) {
        modalContent.innerHTML = html;
        modal.classList.add("active");
    }

    function fecharModal() {
        modal.classList.remove("active");
        // Parar qualquer reprodução de áudio/vídeo ao fechar
        const audioEl = modalContent.querySelector("audio");
        const videoEl = modalContent.querySelector("video");
        if (audioEl) {
            audioEl.pause();
            audioEl.currentTime = 0;
        }
        if (videoEl) {
            videoEl.pause();
            videoEl.currentTime = 0;
        }
    }

    modal.addEventListener("click", e => {
        if (e.target === modal) fecharModal();
    });

    // Formata tamanho em bytes (opcional)
    function formatBytes(bytes, decimals = 2) {
        if (!bytes || bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // ================= FUNÇÃO PARA ANALISAR O VÍDEO =================
    async function analisarVideo() {
        const url = urlInput.value.trim();
        if (!url) {
            alert("Cole o link do vídeo.");
            return;
        }

        // Mostra loading
        infoArea.style.display = "none";
        loadingOrError.innerHTML = `<div class="loader"></div><p>Obtendo informações do vídeo...</p>`;

        try {
            // Faz requisição para obter informações do vídeo e formatos disponíveis
            const response = await fetch(`${API_BASE}/info`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url })
            });

            const data = await response.json();

            if (!response.ok || data.status !== "sucesso") {
                throw new Error(data.message || "Erro ao analisar vídeo");
            }

            // Preenche as informações do vídeo
            exibirInfoVideo(data);
            infoArea.style.display = "block";
            loadingOrError.innerHTML = "";

        } catch (error) {
            console.error(error);
            loadingOrError.innerHTML = `<p class="error-message"><i class="bi bi-exclamation-triangle-fill"></i> ${error.message}</p>`;
            infoArea.style.display = "none";
        }
    }

    // Exibe as informações do vídeo e as qualidades disponíveis
    function exibirInfoVideo(data) {
        // data deve conter: titulo, thumbnail, e uma lista de formatos (formatos)
        // Exemplo de formato: { itag: 18, type: "video", quality: "360p", container: "mp4", size: 1024000, url?: stream_url }
        // Vamos assumir que a API retorna algo estruturado.

        const video = data.video || {};
        const formatos = data.formatos || [];

        // Separar formatos de vídeo e áudio
        const videos = formatos.filter(f => f.type === "video" || f.container === "mp4");
        const audios = formatos.filter(f => f.type === "audio" || f.container === "mp3" || f.audioBitrate);

        // Montar HTML das informações do vídeo
        let infoHtml = '';
        if (video.thumbnail) {
            infoHtml += `<img src="${video.thumbnail}" alt="thumbnail">`;
        } else {
            infoHtml += `<div style="width:120px; height:68px; background:#2c2f55; border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="bi bi-film" style="font-size:2rem; color:var(--muted);"></i></div>`;
        }
        infoHtml += `<div><h3>${video.titulo || 'Sem título'}</h3><p>${video.duracao || ''}</p></div>`;
        videoInfoDiv.innerHTML = infoHtml;

        // Montar botões de qualidade
        let qualitiesHtml = '';

        if (videos.length > 0) {
            qualitiesHtml += `
                <div class="quality-group">
                    <h4><i class="bi bi-camera-video-fill"></i> Vídeo</h4>
                    <div class="quality-buttons">
                        ${videos.map(f => {
                            const label = f.qualidade || f.quality || f.container || 'Desconhecido';
                            const size = f.tamanho ? formatBytes(f.tamanho) : '';
                            return `<button class="quality-btn" onclick="baixar('${f.itag}')" title="${size}"><i class="bi bi-download"></i> ${label} ${size ? '('+size+')' : ''}</button>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        if (audios.length > 0) {
            qualitiesHtml += `
                <div class="quality-group">
                    <h4><i class="bi bi-music-note-beamed"></i> Áudio</h4>
                    <div class="quality-buttons">
                        ${audios.map(f => {
                            const label = f.qualidade || (f.audioBitrate ? f.audioBitrate + ' kbps' : 'MP3');
                            const size = f.tamanho ? formatBytes(f.tamanho) : '';
                            return `<button class="quality-btn" onclick="baixar('${f.itag}')"><i class="bi bi-download"></i> ${label} ${size ? '('+size+')' : ''}</button>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        if (formatos.length === 0) {
            qualitiesHtml = '<p style="color:var(--muted);">Nenhuma qualidade disponível.</p>';
        }

        qualitiesContainer.innerHTML = qualitiesHtml;
    }

    // ================= FUNÇÃO PARA BAIXAR COM ITAG SELECIONADA =================
    async function baixar(itag) {
        const url = urlInput.value.trim();
        if (!url) {
            alert("URL não encontrada.");
            return;
        }

        // Abre modal de processamento
        abrirModal(`
            <div class="loader"></div>
            <h3>Processando...</h3>
            <p>Preparando o download</p>
        `);

        try {
            // Faz requisição para o endpoint de download passando a itag
            const response = await fetch(`${API_BASE}/download`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url, itag }) // enviamos itag em vez de format
            });

            const data = await response.json();

            if (!response.ok || data.status !== "sucesso") {
                throw new Error(data.message || "Erro ao processar download");
            }

            // Verifica se é vídeo ou áudio (pela extensão ou pelo itag)
            const isVideo = data.container === 'mp4' || (data.filename && data.filename.endsWith('.mp4'));
            const playerTag = isVideo 
                ? `<video controls style="width: 100%;"><source src="${data.stream}" type="video/mp4"></video>`
                : `<audio controls style="width: 100%; height: 50px;"><source src="${data.stream}" type="audio/mpeg"></audio>`;

            // Exibe modal com player e botão de download
            modalContent.classList.add("expanded");
            abrirModal(`
                <h3><i class="bi bi-check-circle-fill" style="color:var(--success);"></i> Download concluído</h3>
                <div class="player-container">
                    ${playerTag}
                </div>
                <div class="modal-buttons inline">
                    <a href="${data.download}" download>
                        <button class="btn-video" style="background:var(--success);"><i class="bi bi-download"></i> Salvar</button>
                    </a>
                    <button class="btn-danger" onclick="fecharModal()"><i class="bi bi-x-circle"></i> Fechar</button>
                </div>
            `);

        } catch (error) {
            abrirModal(`
                <h3><i class="bi bi-exclamation-triangle-fill"></i> Erro</h3>
                <p>${error.message}</p>
                <button class="btn-danger" onclick="fecharModal()"><i class="bi bi-x-circle"></i> OK</button>
            `);
        }
    }

    // Opção de pressionar Enter no campo de URL para analisar
    urlInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            analisarVideo();
        }
    });

    // ================= FUNÇÕES LEGADO (caso queira manter compatibilidade) =================
    // As funções antigas foram removidas. O código agora utiliza analisarVideo e baixar(itag)
</script>

<!-- REMOVIDA A PROPAGANDA E REDIRECIONAMENTOS -->
<!-- Nenhum script de monetização ou redirecionamento está presente -->

</body>
</html>
