<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teste CRUD - Equipamentos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-adicionar {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-adicionar:hover {
            background: #27ae60;
        }
        .lista-equipamentos {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 15px;
            border-left: 6px solid #3498db;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-header h3 {
            color: #2c3e50;
            font-size: 20px;
        }
        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }
        .status.valido { background: #2ecc71; }
        .status.atencao { background: #f39c12; }
        .status.vencido { background: #e74c3c; }
        .info-resumo {
            display: flex;
            gap: 15px;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .botoes-card {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.3s;
        }
        .btn.ver { background: #3498db; }
        .btn.editar { background: #f39c12; }
        .btn.excluir { background: #e74c3c; }
        .btn:hover { opacity: 0.8; }

        /* Painel de detalhes */
        .painel-detalhes {
            background: #eef2f7;
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            border: 2px solid #3498db;
        }
        .painel-detalhes h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .detalhe-linha {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #d0d9e5;
        }
        .detalhe-linha .rotulo {
            font-weight: bold;
            width: 40%;
            color: #34495e;
        }
        .detalhe-linha .valor {
            width: 60%;
            color: #2c3e50;
        }
        .fechar-detalhes {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Formulário de adicionar/editar */
        .formulario {
            background: #fef9e7;
            border: 2px solid #f1c40f;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }
        .formulario h3 {
            color: #7d5a2e;
            margin-bottom: 15px;
        }
        .campo {
            margin-bottom: 15px;
        }
        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .campo input, .campo select, .campo textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .botoes-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn.salvar { background: #2ecc71; }
        .btn.cancelar { background: #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Gerenciar Equipamentos</h1>

        <!-- Botão Adicionar -->
        <button class="btn-adicionar" onclick="mostrarFormularioAdicionar()">+ Adicionar Novo Equipamento</button>

        <!-- Lista de Equipamentos -->
        <div id="listaEquipamentos" class="lista-equipamentos">
            <!-- Os cards serão gerados via JavaScript -->
        </div>

        <!-- Painel de Detalhes (inicialmente oculto) -->
        <div id="painelDetalhes" class="painel-detalhes" style="display: none;">
            <h2>📋 Detalhes Completos</h2>
            <div id="conteudoDetalhes"></div>
            <button class="fechar-detalhes" onclick="fecharDetalhes()">Fechar</button>
        </div>

        <!-- Formulário de Adicionar/Editar (inicialmente oculto) -->
        <div id="formularioEquipamento" class="formulario" style="display: none;">
            <h3 id="tituloFormulario">Adicionar Equipamento</h3>
            <input type="hidden" id="equipamentoId">
            <div class="campo">
                <label for="campoCodigo">Código *</label>
                <input type="text" id="campoCodigo" placeholder="Ex: EXT-001">
            </div>
            <div class="campo">
                <label for="campoTipo">Tipo *</label>
                <input type="text" id="campoTipo" placeholder="Ex: Mangueira, Extintor...">
            </div>
            <div class="campo">
                <label for="campoDescricao">Descrição</label>
                <textarea id="campoDescricao" rows="2" placeholder="Descrição breve"></textarea>
            </div>
            <div class="campo">
                <label for="campoArea">Área</label>
                <input type="text" id="campoArea" placeholder="Ex: Setor A">
            </div>
            <div class="campo">
                <label for="campoLocal">Local</label>
                <input type="text" id="campoLocal" placeholder="Ex: Corredor 1">
            </div>
            <div class="campo">
                <label for="campoValidade">Validade</label>
                <input type="date" id="campoValidade">
            </div>
            <div class="campo">
                <label for="campoObs">Observações</label>
                <textarea id="campoObs" rows="2"></textarea>
            </div>
            <div class="botoes-form">
                <button class="btn salvar" onclick="salvarEquipamento()">Salvar</button>
                <button class="btn cancelar" onclick="esconderFormulario()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Banco de dados em memória
        let equipamentos = [
            { id: 1, codigo: 'EXT-001', tipo: 'Mangueira', descricao: 'Mangueira 15m', area: 'Setor A', local: 'Corredor 1', validade: '2025-06-10', obs: 'Inspecionar conexões' },
            { id: 2, codigo: 'EXT-045', tipo: 'Extintor CO2', descricao: '6kg', area: 'Setor B', local: 'Sala máquinas', validade: '2026-02-10', obs: 'Novo' },
            { id: 3, codigo: 'EXT-078', tipo: 'Extintor Pó', descricao: '12kg', area: 'Setor C', local: 'Depósito', validade: '2025-01-05', obs: 'Vencido' }
        ];
        let proximoId = 4;

        // Elementos da UI
        const listaDiv = document.getElementById('listaEquipamentos');
        const painelDetalhes = document.getElementById('painelDetalhes');
        const conteudoDetalhes = document.getElementById('conteudoDetalhes');
        const formulario = document.getElementById('formularioEquipamento');
        const tituloForm = document.getElementById('tituloFormulario');
        const equipamentoId = document.getElementById('equipamentoId');
        const campoCodigo = document.getElementById('campoCodigo');
        const campoTipo = document.getElementById('campoTipo');
        const campoDescricao = document.getElementById('campoDescricao');
        const campoArea = document.getElementById('campoArea');
        const campoLocal = document.getElementById('campoLocal');
        const campoValidade = document.getElementById('campoValidade');
        const campoObs = document.getElementById('campoObs');

        // Função para renderizar a lista
        function renderizarLista() {
            listaDiv.innerHTML = '';
            equipamentos.forEach(eq => {
                const statusClass = calcularStatus(eq.validade);
                const statusText = statusClass === 'valido' ? 'Válido' : (statusClass === 'atencao' ? 'Atenção' : 'Vencido');
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${eq.tipo || 'Sem tipo'}</h3>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="info-resumo">
                        <span><strong>Código:</strong> ${eq.codigo || 'N/A'}</span>
                        <span><strong>Área:</strong> ${eq.area || 'N/A'}</span>
                    </div>
                    <div class="botoes-card">
                        <button class="btn ver" onclick="verDetalhes(${eq.id})">Ver</button>
                        <button class="btn editar" onclick="editarEquipamento(${eq.id})">Editar</button>
                        <button class="btn excluir" onclick="excluirEquipamento(${eq.id})">Excluir</button>
                    </div>
                `;
                listaDiv.appendChild(card);
            });
        }

        // Calcular status com base na validade
        function calcularStatus(validade) {
            if (!validade) return 'atencao'; // sem validade
            const hoje = new Date();
            const val = new Date(validade + 'T00:00:00');
            const diff = Math.ceil((val - hoje) / (1000 * 60 * 60 * 24));
            if (diff < 0) return 'vencido';
            if (diff <= 30) return 'atencao';
            return 'valido';
        }

        // Formatar data para exibição (YYYY-MM-DD para DD/MM/YYYY)
        function formatarData(data) {
            if (!data) return 'Não informada';
            const partes = data.split('-');
            if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
            return data;
        }

        // Mostrar detalhes de um equipamento
        function verDetalhes(id) {
            const eq = equipamentos.find(e => e.id === id);
            if (!eq) return;
            let html = `
                <div class="detalhe-linha"><span class="rotulo">Código:</span><span class="valor">${eq.codigo || 'N/A'}</span></div>
                <div class="detalhe-linha"><span class="rotulo">Tipo:</span><span class="valor">${eq.tipo || 'N/A'}</span></div>
                <div class="detalhe-linha"><span class="rotulo">Descrição:</span><span class="valor">${eq.descricao || 'N/A'}</span></div>
                <div class="detalhe-linha"><span class="rotulo">Área:</span><span class="valor">${eq.area || 'N/A'}</span></div>
                <div class="detalhe-linha"><span class="rotulo">Local:</span><span class="valor">${eq.local || 'N/A'}</span></div>
                <div class="detalhe-linha"><span class="rotulo">Validade:</span><span class="valor">${formatarData(eq.validade)}</span></div>
                <div class="detalhe-linha"><span class="rotulo">Observações:</span><span class="valor">${eq.obs || 'N/A'}</span></div>
            `;
            // Se for mangueira, adiciona campos extras (exemplo)
            if (eq.tipo && eq.tipo.toLowerCase().includes('mangueira')) {
                html += `
                    <div class="detalhe-linha"><span class="rotulo">Chave Storz:</span><span class="valor">Sim</span></div>
                    <div class="detalhe-linha"><span class="rotulo">Adaptador Storz:</span><span class="valor">Não</span></div>
                `;
            }
            conteudoDetalhes.innerHTML = html;
            painelDetalhes.style.display = 'block';
        }

        function fecharDetalhes() {
            painelDetalhes.style.display = 'none';
        }

        // Abrir formulário para adicionar
        function mostrarFormularioAdicionar() {
            tituloForm.innerText = 'Adicionar Equipamento';
            equipamentoId.value = '';
            campoCodigo.value = '';
            campoTipo.value = '';
            campoDescricao.value = '';
            campoArea.value = '';
            campoLocal.value = '';
            campoValidade.value = '';
            campoObs.value = '';
            formulario.style.display = 'block';
        }

        // Editar equipamento: preencher formulário com dados existentes
        function editarEquipamento(id) {
            const eq = equipamentos.find(e => e.id === id);
            if (!eq) return;
            tituloForm.innerText = 'Editar Equipamento';
            equipamentoId.value = eq.id;
            campoCodigo.value = eq.codigo || '';
            campoTipo.value = eq.tipo || '';
            campoDescricao.value = eq.descricao || '';
            campoArea.value = eq.area || '';
            campoLocal.value = eq.local || '';
            campoValidade.value = eq.validade || '';
            campoObs.value = eq.obs || '';
            formulario.style.display = 'block';
        }

        function esconderFormulario() {
            formulario.style.display = 'none';
        }

        // Salvar (adicionar ou atualizar)
        function salvarEquipamento() {
            const id = equipamentoId.value ? parseInt(equipamentoId.value) : null;
            const dados = {
                codigo: campoCodigo.value.trim(),
                tipo: campoTipo.value.trim(),
                descricao: campoDescricao.value.trim(),
                area: campoArea.value.trim(),
                local: campoLocal.value.trim(),
                validade: campoValidade.value,
                obs: campoObs.value.trim()
            };
            if (!dados.codigo || !dados.tipo) {
                alert('Código e Tipo são obrigatórios!');
                return;
            }
            if (id) {
                // Atualizar
                const index = equipamentos.findIndex(e => e.id === id);
                if (index !== -1) {
                    equipamentos[index] = { ...equipamentos[index], ...dados };
                }
            } else {
                // Adicionar novo
                dados.id = proximoId++;
                equipamentos.push(dados);
            }
            renderizarLista();
            esconderFormulario();
        }

        // Excluir equipamento
        function excluirEquipamento(id) {
            if (confirm('Tem certeza que deseja excluir este equipamento?')) {
                equipamentos = equipamentos.filter(e => e.id !== id);
                renderizarLista();
                // Se detalhes estiver aberto desse equipamento, fechar
                fecharDetalhes();
            }
        }

        // Inicializar
        renderizarLista();
    </script>
</body>
</html>
