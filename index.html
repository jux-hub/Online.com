<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader YouTube (sem anúncios)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #eef2fb;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: #151e2f;
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .sub {
            color: #9aa8c7;
            margin-bottom: 28px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            background: #1f2a40;
            border-radius: 60px;
            padding: 4px;
            border: 1px solid #2e3b55;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 20px;
            font-size: 1rem;
            color: white;
            outline: none;
        }
        .input-group input::placeholder {
            color: #6a7c9e;
        }
        .input-group button {
            background: #3b6eff;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0 28px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover {
            background: #2855d0;
        }
        .loading {
            text-align: center;
            margin: 30px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #2e3b55;
            border-top-color: #3b6eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-video {
            display: flex;
            gap: 16px;
            background: #1f2a40;
            border-radius: 24px;
            padding: 16px;
            margin: 24px 0;
        }
        .info-video img {
            width: 160px;
            height: 90px;
            object-fit: cover;
            border-radius: 16px;
            background: #2e3b55;
        }
        .info-video h3 {
            margin: 0 0 6px;
            font-size: 1.2rem;
        }
        .info-video p {
            color: #9aa8c7;
            font-size: 0.9rem;
        }
        .qualities {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 24px 0;
        }
        .quality-group {
            background: #1a2336;
            border-radius: 20px;
            padding: 16px;
        }
        .quality-group h4 {
            margin: 0 0 12px;
            font-size: 1rem;
            color: #b7c3e0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn-quality {
            background: #2a344d;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-quality:hover {
            background: #3b6eff;
        }
        .btn-quality i { font-size: 1rem; }
        .error {
            color: #ff6b6b;
            background: #2a1f1f;
            padding: 14px;
            border-radius: 16px;
            margin: 20px 0;
            text-align: center;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            text-align: center;
            color: #6a7c9e;
        }
        .footer a {
            color: #9aa8c7;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📥 YouTube Downloader</h1>
    <div class="sub">sem anúncios · código aberto · rápido</div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Cole o link do YouTube (ex: https://youtu.be/...)" value="">
        <button id="analyzeBtn">Analisar</button>
    </div>

    <!-- área de carregamento / erro / resultado -->
    <div id="resultArea"></div>

    <div class="footer">
        🌐 usando a API pública do <a href="https://cobalt.tools" target="_blank">cobalt</a> • sem propagandas
    </div>
</div>

<script>
    const API_URL = 'https://api.cobalt.tools/';
    const urlInput = document.getElementById('urlInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultArea = document.getElementById('resultArea');

    // estado para guardar o último JSON retornado (útil se a api retornar picker)
    let lastVideoData = null;

    analyzeBtn.addEventListener('click', analisarVideo);
    urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') analisarVideo(); });

    async function analisarVideo() {
        const url = urlInput.value.trim();
        if (!url) {
            alert('Por favor, cole uma URL do YouTube.');
            return;
        }

        // Mostra loading
        resultArea.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Obtendo informações...</p>
            </div>
        `;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    url: url,
                    // Parâmetros opcionais para já solicitar formato, mas vamos deixar a API decidir
                })
            });

            if (!response.ok) {
                throw new Error(`Erro HTTP ${response.status}`);
            }

            const data = await response.json();
            lastVideoData = data; // guarda para uso posterior

            // Se a API retornar erro
            if (data.status === 'error') {
                throw new Error(data.text || 'Falha ao processar vídeo');
            }

            // Exibe o resultado de acordo com o que a API retornar
            exibirResultado(data, url);

        } catch (error) {
            resultArea.innerHTML = `<div class="error">❌ ${error.message}</div>`;
        }
    }

    function exibirResultado(data, originalUrl) {
        // Exemplo de estrutura da API cobalt:
        // { "status": "picker", "picker": [ { "type": "video", "url": "...", "quality": "1080p", ... } ], "audio": "...", "url": "...", "title": "...", "thumbnail": "..." }
        // { "status": "redirect", "url": "link direto", "filename": "...", ... }

        // Se já tiver um link direto (status "redirect") ou "success", podemos exibir direto
        if (data.status === 'redirect' || data.status === 'success' || data.url) {
            // link direto (provavelmente já escolheu a melhor qualidade)
            resultArea.innerHTML = `
                <div style="margin: 24px 0; text-align: center;">
                    <div style="background: #1a6d3b; padding: 16px; border-radius: 60px;">
                        <p style="margin-bottom: 12px;"><strong>✅ Download pronto</strong></p>
                        <a href="${data.url}" target="_blank" style="background: white; color: #0b0e14; padding: 10px 24px; border-radius: 40px; font-weight: 600; text-decoration: none;">📥 Baixar agora</a>
                    </div>
                </div>
            `;
            return;
        }

        // Se for um "picker" (múltiplas opções)
        if (data.status === 'picker' && data.picker) {
            let html = '';

            // Informações do vídeo (se houver)
            if (data.thumbnail || data.title) {
                html += `<div class="info-video">`;
                if (data.thumbnail) html += `<img src="${data.thumbnail}" alt="thumbnail">`;
                html += `<div><h3>${data.title || 'Vídeo'}</h3>`;
                if (data.duration) html += `<p>⏱️ ${data.duration}</p>`;
                html += `</div></div>`;
            }

            // Separa vídeo e áudio
            const videoOptions = data.picker.filter(opt => opt.type === 'video');
            const audioOptions = data.picker.filter(opt => opt.type === 'audio');

            // Container de qualidades
            html += `<div class="qualities">`;

            // Opções de vídeo
            if (videoOptions.length) {
                html += `<div class="quality-group"><h4>🎬 Vídeo</h4><div class="buttons">`;
                videoOptions.forEach(opt => {
                    const label = opt.quality || opt.text || 'Desconhecido';
                    const size = opt.size ? ` (${opt.size})` : '';
                    html += `<button class="btn-quality" onclick="baixarUrl('${opt.url}')"><i class="⬇️"></i> ${label}${size}</button>`;
                });
                html += `</div></div>`;
            }

            // Opções de áudio
            if (audioOptions.length) {
                html += `<div class="quality-group"><h4>🎵 Áudio</h4><div class="buttons">`;
                audioOptions.forEach(opt => {
                    const label = opt.quality || (opt.bitrate ? opt.bitrate + ' kbps' : 'MP3');
                    const size = opt.size ? ` (${opt.size})` : '';
                    html += `<button class="btn-quality" onclick="baixarUrl('${opt.url}')"><i class="⬇️"></i> ${label}${size}</button>`;
                });
                html += `</div></div>`;
            }

            html += `</div>`;

            // Se houver áudio separado (as vezes vem em "audio")
            if (data.audio) {
                html += `<div style="margin-top: 16px;"><button class="btn-quality" onclick="baixarUrl('${data.audio}')">🎧 Baixar só áudio (melhor qualidade)</button></div>`;
            }

            resultArea.innerHTML = html;
        } else {
            // Fallback: se não reconhecer o formato, mostra o JSON
            resultArea.innerHTML = `<pre style="background: #1f2a40; padding: 16px; border-radius: 16px; overflow: auto;">${JSON.stringify(data, null, 2)}</pre>`;
        }
    }

    // Função global para baixar a URL escolhida (abre em nova aba)
    window.baixarUrl = function(downloadUrl) {
        if (downloadUrl) {
            window.open(downloadUrl, '_blank');
        } else {
            alert('Link indisponível');
        }
    };
</script>
</body>
</html>
