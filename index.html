<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEBUG MODAL FIREGUARDIAN</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: #eee; padding: 20px; text-align: center; }

        .btn-abrir {
            padding: 20px; background: #d32f2f; color: white;
            border: none; border-radius: 10px; font-weight: bold; width: 100%;
        }

        /* O SEGREDO ESTÁ AQUI: Overlay fixo e Content relativo */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; /* Começa escondido */
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .modal-content {
            background: #ffffff;
            width: 85%;
            max-width: 400px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            /* Força a visibilidade no Android */
            visibility: visible !important;
            opacity: 1 !important;
        }

        .modal-overlay.active {
            display: flex; /* Mostra o modal */
        }

        h2 { color: #d32f2f; margin-top: 0; }
        p { color: #333; line-height: 1.5; }
        .close-btn { margin-top: 20px; padding: 10px; width: 100%; background: #ccc; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>FireGuardian App</h1>
    <p>Clique no botão para testar se o modal aparece sobre o fundo escuro.</p>

    <button class="btn-abrir" onclick="abrirModal()">ABRIR DETALHES</button>

    <div id="meuModal" class="modal-overlay" onclick="fecharModal(event)">
        <div class="modal-content">
            <h2><i class="fas fa-info-circle"></i> Funcionou!</h2>
            <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: left;">
                <p><strong>Item:</strong> Extintor PQS 4kg</p>
                <p><strong>Local:</strong> Corredor Central</p>
                <p><strong>Status:</strong> Ativo</p>
            </div>
            <button class="close-btn" onclick="document.getElementById('meuModal').classList.remove('active')">FECHAR</button>
        </div>
    </div>

    <script>
        function abrirModal() {
            const modal = document.getElementById('meuModal');
            modal.classList.add('active');
            // Log para você ver no Logcat do Android Studio
            console.log("Modal acionado via JS");
        }

        function fecharModal(e) {
            if(e.target.id === 'meuModal') {
                document.getElementById('meuModal').classList.remove('active');
            }
        }
    </script>
</body>
</html>
