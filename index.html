<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teste Modal - Webview Android</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary: #1976d2;
      --danger: #d32f2f;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }
    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    /* Modal corrigido */
    #modal-detalhes {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #modal-detalhes .modal-content {
      background: white;
      max-width: 90%;
      max-height: 90vh;
      width: 500px;
      border-radius: 12px;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      -webkit-overflow-scrolling: touch;
    }
    .close {
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .badge {
      color: white;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <h2>Teste de Modal</h2>
  <button onclick="abrirDetalhes(1)">Abrir Completo</button>
  <button onclick="abrirDetalhesSimplificado(1)">Abrir Simplificado</button>

  <!-- Modal -->
  <div id="modal-detalhes">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // Simulação do banco de dados
    const db = [
      {
        id: 1,
        codigo: 'EXT-001',
        tipo: 'Mangueira',
        descricao: 'Mangueira de incêndio 15m',
        area: 'Setor A',
        local: 'Corredor 1',
        ultima: '2025-01-10',
        validade: '2025-06-10',
        chaveStorz: 'sim',
        adaptadorStorz: 'não',
        obs: 'Inspecionar conexões mensalmente.'
      }
    ];

    function getStatus(validade) {
      if (!validade) return { class: 'nodata', icon: 'fa-info-circle', text: 'Sem validade', days: null };
      const hoje = new Date();
      const val = new Date(validade.split('-').join('-'));
      const diff = Math.ceil((val - hoje) / (1000 * 60 * 60 * 24));
      if (diff < 0) return { class: 'expired', icon: 'fa-times-circle', text: 'Vencido', days: diff };
      if (diff <= 30) return { class: 'warning', icon: 'fa-exclamation-triangle', text: 'Próximo ao vencimento', days: diff };
      return { class: 'ok', icon: 'fa-check-circle', text: 'Válido', days: diff };
    }

    function fecharModal() {
      document.getElementById('modal-detalhes').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    // ===== VERSÃO COMPLETA (corrigida com overflow) =====
    function abrirDetalhes(id) {
      const item = db.find(i => i.id === id);
      if (!item) return;

      const st = getStatus(item.validade);
      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = '';

      const statusBadgeColor = {
        'expired': '#c62828',
        'warning': '#ff9800',
        'ok': '#2e7d32',
        'nodata': '#78909c'
      }[st.class] || '#78909c';

      const statusIcon = st.icon || 'fa-info-circle';
      const statusText = st.text || 'Desconhecido';

      function formatarData(data) {
        if (!data) return 'Não informado';
        return data.split('-').reverse().join('/');
      }

      let mangueiraInfo = '';
      if (item.tipo && item.tipo.toString().toLowerCase() === 'mangueira') {
        const chaveStorz = item.chaveStorz ? (item.chaveStorz === 'sim' ? 'Sim' : 'Não') : 'Não informado';
        const adaptadorStorz = item.adaptadorStorz ? (item.adaptadorStorz === 'sim' ? 'Sim' : 'Não') : 'Não informado';
        mangueiraInfo = `
          <div style="background: linear-gradient(135deg, #fff3e0, #ffe0b2); padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #fb8c00;">
            <h5 style="margin: 0 0 10px 0; color: #e65100;"><i class="fas fa-tape"></i> Especificações da Mangueira</h5>
            <p style="margin: 8px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-key" style="color: #f57c00; width: 20px;"></i><strong>Chave Storz:</strong> ${chaveStorz}</p>
            <p style="margin: 8px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-plug" style="color: #43a047; width: 20px;"></i><strong>Adaptador Storz:</strong> ${adaptadorStorz}</p>
          </div>`;
      }

      modalBody.innerHTML = `
        <div style="margin-bottom: 20px; text-align: center;">
          <span class="badge" style="background: ${statusBadgeColor}; font-size: 1.1rem; padding: 8px 20px;">
            <i class="fas ${statusIcon}"></i> ${statusText}
          </span>
        </div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-barcode" style="color: var(--primary); width: 20px;"></i><strong>Código:</strong> <span style="color: var(--primary); font-weight: 600;">${item.codigo || 'N/A'}</span></p>
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-fire-extinguisher" style="color: var(--primary); width: 20px;"></i><strong>Tipo:</strong> ${item.tipo || 'N/A'}</p>
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-align-left" style="color: var(--primary); width: 20px;"></i><strong>Descrição:</strong> ${item.descricao || 'N/A'}</p>
        </div>
        ${mangueiraInfo}
        <div style="background: #e3f2fd; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-map-marker-alt" style="color: #1976d2; width: 20px;"></i><strong>Área:</strong> ${item.area || 'N/A'}</p>
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-location-arrow" style="color: #1976d2; width: 20px;"></i><strong>Local:</strong> ${item.local || 'N/A'}</p>
        </div>
        ${item.validade ? `
        <div style="background: #fff3e0; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-calendar-check" style="color: #f57c00; width: 20px;"></i><strong>Última Inspeção:</strong> ${formatarData(item.ultima)}</p>
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-calendar-times" style="color: #f57c00; width: 20px;"></i><strong>Próxima Validade:</strong> ${formatarData(item.validade)}</p>
          <p style="margin: 10px 0; display: flex; align-items: center; gap: 10px;"><i class="fas fa-clock" style="color: #f57c00; width: 20px;"></i><strong>Dias Restantes:</strong> <span style="font-weight: 600; color: ${statusBadgeColor};">${st.days !== null ? st.days + ' dias' : 'N/A'}</span></p>
        </div>
        ` : `
        <div style="background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center;">
          <i class="fas fa-box" style="font-size: 2rem; color: #78909c; margin-bottom: 10px;"></i>
          <p><strong>Item de inventário sem controle de validade</strong></p>
        </div>
        `}
        ${item.obs ? `
        <div style="background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #fbc02d;">
          <p style="margin: 0; display: flex; align-items: flex-start; gap: 10px;"><i class="fas fa-sticky-note" style="color: #f57c00; width: 20px; margin-top: 3px;"></i><span><strong>Observações:</strong><br>${item.obs}</span></p>
        </div>
        ` : ''}
        <div style="margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <button onclick="fecharModal(); alert('Editar item ${item.id}')" style="padding: 12px 20px; background: linear-gradient(135deg, #1976d2, #1565c0); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Editar</button>
          <button onclick="fecharModal(); alert('Excluir item ${item.id}')" style="padding: 12px 20px; background: linear-gradient(135deg, var(--danger), #b71c1c); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Excluir</button>
        </div>
      `;

      const modal = document.getElementById('modal-detalhes');
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // ===== VERSÃO SIMPLIFICADA =====
    function abrirDetalhesSimplificado(id) {
      const item = db.find(i => i.id === id);
      if (!item) return;

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <div style="padding: 10px;">
          <h3>${item.codigo || 'Item'}</h3>
          <p><strong>Tipo:</strong> ${item.tipo || 'N/A'}</p>
          <p><strong>Validade:</strong> ${item.validade || 'N/A'}</p>
          <p><strong>Área:</strong> ${item.area || 'N/A'}</p>
          <p><strong>Local:</strong> ${item.local || 'N/A'}</p>
          ${item.obs ? `<p><strong>Obs:</strong> ${item.obs}</p>` : ''}
        </div>
      `;

      const modal = document.getElementById('modal-detalhes');
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // Fechar ao clicar fora do conteúdo
    document.getElementById('modal-detalhes').addEventListener('click', function(e) {
      if (e.target === this) fecharModal();
    });
  </script>
</body>
</html>
